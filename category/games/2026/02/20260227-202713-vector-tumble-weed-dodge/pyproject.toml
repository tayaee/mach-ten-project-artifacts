[project]
name = "vector-tumble-weed-dodge"
version = "0.1.0"
description = "Survive the desert storm by dodging endless waves of fast-moving tumbleweeds"
requires-python = ">=3.11,<3.14"
dependencies = ["pygame>=2.5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
